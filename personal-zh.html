      <div class="eyebrow">个人</div>
      <h1>个人</h1>
      <p>我喜欢走到户外，看看新的地方，也享受更慢、更稳定的节奏。</p>
    </section>

    <section class="prose">
      <h2>徒步</h2>
      <p>我已经徒步 24 年以上，仍然喜欢走到山脊、看到山谷豁然展开的那一刻。我喜欢安静的路径、山间空气、路上的小镇，也喜欢在户外走了一整天之后吃上一顿好饭的简单快乐。</p>
      <h2>跑步</h2>
      <p>我也跑过 20 多次全程马拉松。我喜欢比赛日清晨的氛围、赛道旁的人群、与成千上万人一起奔跑的节奏，以及疲惫而开心地冲过终点线的感觉。</p>
    </section>
