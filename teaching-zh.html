      <p>
        本学期，我为北京雁栖湖数学与人工智能学院讲授<strong>《数据库原理与应用》</strong>课程。该学院由
        BIMSA 与北京两所高校联合建设。课程涵盖数据库系统的理论基础，以及面向实际问题的应用实践，包括数据建模、
        关系代数与 SQL、事务处理、索引与查询优化，以及这些原理与实际系统设计的联系。
